[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "spenpy"
version = "1.0.0"
description = "Differentiable SPEN/xSPEN simulation, reconstruction and MRI data readers"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["numpy>=1.24", "torch>=2.2"]

[project.optional-dependencies]
recon = ["scipy>=1.10"]
io = ["scipy>=1.10", "h5py>=3.8", "Pillow>=9", "nibabel>=5", "twixtools>=0.24", "pynrrd>=1"]
dev = ["pytest>=7", "matplotlib>=3.7", "ruff"]

[project.urls]
Repository = "https://github.com/MVChem/spenpy"
Changelog = "https://github.com/MVChem/spenpy/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["spenpy*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires local scanner reference data"]

[tool.ruff]
extend-exclude = ["spenpy/_legacy"]
